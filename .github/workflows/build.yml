name: Build Mini Geosite

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Clone compiler and build
        run: |
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git compiler
          cd compiler
          rm -rf data/*
          cp -r ../data/* data/
          go run ./ --outputdir=../dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geosite
          path: dist/dlc.dat
